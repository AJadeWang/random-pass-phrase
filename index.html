<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Passphrase Generator</title>
    <link rel="stylesheet" href="index_style.css">
</head>
<body>
    <body>
    <div class="container">
        <h1>🔐 Custom Passphrase Generator</h1>
        <p class="subtitle">Build your passphrase with custom segments</p>

        <!-- Passphrase Display -->
        <div class="passphrase-display" id="passphraseDisplay">Click generate to create your passphrase</div>
        <button class="btn-copy" id="copyBtn">📋 Copy to Clipboard</button>

        <!-- Segments List -->
        <div class="segments-section">
            <div class="segments-header">
                <h3>Passphrase Segments</h3>
                <button class="btn-add" id="addSegmentBtn">+ Add Segment</button>
            </div>
            <div id="segmentsList" class="segments-list">
                <!-- Segments will be rendered here -->
            </div>
        </div>

        <!-- Generate Button -->
        <button class="btn-generate" id="generateBtn">✨ Generate Passphrase</button>

        <!-- Strength Indicator -->
        <div class="strength-indicator">
            <div>Passphrase Strength</div>
            <div class="strength-bar">
                <div class="strength-fill" id="strengthFill" style="width: 100%;"></div>
            </div>
        </div>
        <div class="footer">🚀 No data stored • All generation happens in your browser</div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
